<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f6f7">
<meta name="description" content="Shop Winter Collection by Maazi.">
<title>Winter Collection by Maazi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="snow" aria-hidden="true"></div>
<header class="site-header">
<h1 class="brand">Winter Collection</h1>
<p class="tagline">by Maazi · Winter 2026</p>
</header>
<section class="hero">
<h2>Perfect your style</h2>
<p>Explore the collection. Swipe through the pictures to see every detail.</p>
</section>
<div class="toolbar">
<input id="search" type="search" placeholder="Search products..." aria-label="Search products" autocomplete="off">
</div>
<p id="status-message" role="status" aria-live="polite">Loading your collection...</p>
<main><section id="grid" class="product-grid" aria-label="Products"></section></main>
<footer>Winter Collection by Maazi<br>Quality · Style · Winter essentials</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
<script>
const snow=document.getElementById("snow");
for(let i=0;i<30;i++){const f=document.createElement("span");f.className="flake";f.textContent="❄";f.style.left=Math.random()*100+"%";f.style.animationDuration=(6+Math.random()*8)+"s";f.style.animationDelay=(-Math.random()*12)+"s";f.style.fontSize=(8+Math.random()*12)+"px";snow.appendChild(f)}
</script>
</body>
</html>

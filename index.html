<style>
:root{--green:#14110c;--sand:#15120d;--brown:#d4af6a;--bg:#0b0a08;--ink:#f1e6cc;--mut:#a79b82;--line:#33291a;--card:#16130d;--btnbg:linear-gradient(135deg,#e6c887,#b8893b);--btnfg:#15110a;--gold:#d4af6a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.bar{display:flex;gap:10px;align-items:center;margin:12px 0}

#scrim{position:fixed;inset:0;background:#0008;z-index:25;display:none}
footer{text-align:center;color:var(--mut);font-size:13px;padding:30px 18px}
footer{border-top:1px solid var(--line);margin-top:30px}.flogo{width:190px;max-width:60%;display:block;margin:0 auto 6px;border-radius:12px}.ftag{margin-bottom:16px}.social{display:flex;gap:12px;justify-content:center;margin-bottom:16px}.social a{width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;transition:background .2s,color .2s}.social a:hover,.social a:focus-visible{background:var(--gold);color:#15110a}.social svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.copy{font-size:12px}
@media(max-width:420px){header{padding:10px 12px;gap:6px}.bt .w1{font-size:2.65vw;letter-spacing:.01em}.bt .w2{font-size:5.4vw;padding-left:10%}.ic{padding:5px}.ic svg{width:22px;height:22px}.menu{width:40px;height:40px}}
@media(min-width:760px){.hero{grid-template-columns:1.1fr 1fr;align-items:center;margin-left:auto;margin-right:auto}.logohero{justify-self:center;width:100%}}
@media(max-width:800px){.wrap{grid-template-columns:1fr}aside{position:fixed;left:0;top:0;bottom:0;width:270px;background:var(--bg);z-index:30;transform:translateX(-100%);transition:transform .25s;padding-top:70px;border-right:1px solid var(--line)}aside.show{transform:none}#scrim.show{display:block}.det{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr;gap:12px}.pn{font-size:19px}}
@media(min-width:801px){.menu{display:none}}
</style>

</style>

<script>
const DB=window.maaziSupabase,FN="https://extbxdbzyfpbnpnhswsu.supabase.co/functions/v1/upload-payment-proof",KEY="sb_publishable_imfAmf4GjqdTgzimy7T_iw_xSZLRCX2",ADV_PCT=0.5,DEL=250,WA="923189250877";
const adv=T=>Math.ceil(T*ADV_PCT);
const $=id=>document.getElementById(id),rs=n=>"PKR "+Number(n||0).toLocaleString("en-US");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const ORD=["XS","S","M","L","XL","XXL"],wa=m=>"https://wa.me/"+WA+"?text="+encodeURIComponent(m);
let P=[],SET={};
const st={cat:"All Products",size:null,col:null,stock:false,price:0,max:0,sort:"n",pos:{},cart:[]};
function imgs(v){let a=v;if(typeof a=="string"){try{a=JSON.parse(a)}catch{a=[a]}}if(!Array.isArray(a))a=a?[a]:[];return a.map(x=>typeof x=="string"?x.trim():(x&&(x.url||x.publicUrl||x.src))||"").filter(u=>/^https?:\/\//i.test(u))}
const stockOf=p=>p.v.reduce((t,v)=>t+v.stock,0),vlabel=v=>[v.size,v.color].filter(Boolean).join(" / ")||"Standard";
const findV=id=>{for(const p of P){const v=p.v.find(x=>String(x.id)==String(id));if(v)return{p,v}}return null};
const total=()=>st.cart.reduce((t,l)=>{const f=findV(l.vid);return t+(f?f.p.price*l.q:0)},0);
const inCat=(p,c)=>c=="All Products"||(c=="Sale"?p.old>p.price:p.cat==c);
const cats=()=>{const c=["All Products",...new Set(P.map(p=>p.cat).filter(Boolean))];if(P.some(p=>p.old>p.price))c.push("Sale");return c};
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",3500)}
function saveCart(){try{localStorage.setItem("maazi_cart",JSON.stringify(st.cart))}catch{}}
function loadCart(){try{st.cart=JSON.parse(localStorage.getItem("maazi_cart")||"[]").filter(l=>findV(l.vid)).map(l=>({vid:l.vid,q:Math.min(l.q,findV(l.vid).v.stock)})).filter(l=>l.q>0)}catch{st.cart=[]}}
async function load(){
 if(!DB){$("grid").innerHTML=`<p class="none">Store connection nahi ho saka.</p>`;return}
 try{
  const a=await DB.from("products").select("*").eq("is_active",true).order("created_at",{ascending:false});if(a.error)throw a.error;
  const pr=a.data||[],ids=pr.map(p=>p.id);let vs=[];
  if(ids.length){const r=await DB.from("product_variants").select("id,product_id,size,color,stock").in("product_id",ids);if(r.error)throw r.error;vs=r.data||[]}
  P=pr.map(p=>({id:p.id,name:p.name||"Product",desc:p.description||"",cat:String(p.category||"").trim(),price:Number(p.price)||0,old:Number(p.old_price||p.compare_at_price||p.original_price)||0,imgs:imgs(p.images),v:vs.filter(v=>String(v.product_id)==String(p.id)).map(v=>({id:v.id,size:v.size||"",color:v.color||"",stock:Math.max(0,Number(v.stock)||0)}))}));
  const s=await DB.from("settings").select("key,value").in("key",["easypaisa_title","easypaisa_number","advance_instructions"]);
  SET=Object.fromEntries((s.data||[]).map(x=>[x.key,x.value]));
  st.max=Math.max(1000,Math.ceil(Math.max(0,...P.map(p=>p.price))/250)*250);
  if(!st.price||st.price>st.max)st.price=st.max;
  const r=$("price");r.min=0;r.max=st.max;r.step=250;r.value=st.price;$("pv").textContent=st.price;
  loadCart();drawNav();list();drawCart();
 }catch(e){console.error(e);$("grid").innerHTML=`<p class="none">Products load nahi ho sake. Dobara koshish karein.</p>`}
}
function drawNav(){const C=cats();if(!C.includes(st.cat))st.cat="All Products";
 $("cats").innerHTML=C.map((c,i)=>`<button class="cat ${c==st.cat?"on":""}" data-c="${i}">${esc(c)}<small>${P.filter(p=>inCat(p,c)).length}</small></button>`).join("");
 const rk=s=>ORD.indexOf(s)<0?99:ORD.indexOf(s);
 const sizes=[...new Set(P.flatMap(p=>p.v.map(v=>v.size)).filter(Boolean))].sort((a,b)=>rk(a)-rk(b)||a.localeCompare(b));
 $("fs").innerHTML=sizes.map(s=>`<button class="chip ${st.size==s?"on":""}" data-s="${esc(s)}">${esc(s)}</button>`).join("");
 const cols=[...new Set(P.flatMap(p=>p.v.map(v=>v.color)).filter(Boolean))];
 $("fcw").style.display=cols.length?"":"none";
 $("fc").innerHTML=cols.map(c=>`<button class="chip ${st.col==c?"on":""}" data-k="${esc(c)}">${esc(c)}</button>`).join("");
 $("stock").classList.toggle("on",st.stock)}
function list(){
 let r=P.filter(p=>inCat(p,st.cat)&&p.price<=st.price&&(!st.size||p.v.some(v=>v.size==st.size&&v.stock>0))&&(!st.col||p.v.some(v=>v.color==st.col))&&(!st.stock||stockOf(p)>0));
 if(st.sort=="l")r.sort((a,b)=>a.price-b.price);if(st.sort=="h")r.sort((a,b)=>b.price-a.price);
 $("title").textContent=st.cat;$("count").textContent=r.length+" products";
 $("grid").innerHTML=r.length?r.map(card).join(""):`<p class="none">${P.length?"No products match these filters. Change a filter to see more.":"Abhi koi product available nahi hai."}</p>`}
const art=(p,k)=>p.imgs.length?`<img src="${esc(p.imgs[k])}" alt="${esc(p.name)}" loading="lazy" draggable="false">`:`<div class="ph">Photo coming soon</div>`;
function card(p){const n=Math.max(1,p.imgs.length),i=Math.min(st.pos[p.id]||0,n-1),a=stockOf(p)>0,sz=[...new Set(p.v.map(v=>v.size).filter(Boolean))];
 return `<article class="card"><div class="slider" data-sl="${esc(p.id)}" data-n="${n}"><div class="slides" style="transform:translateX(-${i*100}%)">${Array.from({length:n},(_,k)=>`<div class="slide" data-o="${esc(p.id)}">${art(p,k)}</div>`).join("")}</div>
 ${p.old>p.price?`<span class="badge">Sale</span>`:!a?`<span class="badge" style="background:#444;color:#fff">Sold out</span>`:""}
 ${n>1?`<div class="dots">${Array.from({length:n},(_,k)=>`<i class="${k==i?"on":""}" data-d="${esc(p.id)}:${k}"></i>`).join("")}</div>`:""}</div>
 <div class="pn">${esc(p.name)}</div><div class="price">${rs(p.price)}${p.old>p.price?`<s>${rs(p.old)}</s>`:""}</div>
 <div class="sizes">${sz.length?"Sizes: "+sz.map(s=>p.v.some(v=>v.size==s&&v.stock>0)?esc(s):`<s>${esc(s)}</s>`).join(" · "):"&nbsp;"}</div>
 <button class="order fill" data-o="${esc(p.id)}" ${a?"":"disabled"}>${a?"ORDER NOW":"OUT OF STOCK"}</button></article>`}
function open(id){const p=P.find(x=>String(x.id)==String(id));if(!p)return;let sel=null,i=0;const n=Math.max(1,p.imgs.length);
 const draw=()=>{const sv=sel&&p.v.find(v=>String(v.id)==String(sel));
  $("pp").innerHTML=`<button class="x" aria-label="Close">×</button><div class="det"><div class="slider"><div class="slides" style="transform:translateX(-${i*100}%)">${Array.from({length:n},(_,k)=>`<div class="slide">${art(p,k)}</div>`).join("")}</div>${n>1?`<button class="arr l" id="pl" aria-label="Previous photo">‹</button><button class="arr r" id="pr" aria-label="Next photo">›</button><div class="dots">${Array.from({length:n},(_,k)=>`<i class="${k==i?"on":""}"></i>`).join("")}</div>`:""}</div>
  <div><h2>${esc(p.name)}</h2><p style="color:var(--mut);margin:4px 0 10px">${esc(p.cat)}</p><div class="price" style="font-size:24px">${rs(p.price)}${p.old>p.price?`<s>${rs(p.old)}</s>`:""}</div>
  <p style="margin:14px 0;color:var(--mut);line-height:1.6;white-space:pre-line">${esc(p.desc)}</p>
  <div class="f"><label>Select size</label><div style="display:flex;gap:7px;flex-wrap:wrap">${p.v.length?p.v.map(v=>`<button class="chip ${String(sel)==String(v.id)?"on":""}" data-z="${esc(v.id)}" ${v.stock?"":"disabled"}>${esc(vlabel(v))}</button>`).join(""):`<small style="color:var(--mut)">Currently unavailable</small>`}</div>${sv?`<small style="color:var(--mut)">${sv.stock} left</small>`:""}</div>
  <button class="primary" id="add">Add to cart</button></div></div>`;
  $("pp").querySelector(".x").onclick=()=>$("pov").classList.remove("show");
  if(n>1){$("pl").onclick=()=>{i=(i+n-1)%n;draw()};$("pr").onclick=()=>{i=(i+1)%n;draw()}}
  $("pp").querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{sel=b.dataset.z;draw()});
  $("add").onclick=()=>{if(!sv)return toast("Select a size first");addCart(sv);$("pov").classList.remove("show")}};
 draw();$("pov").classList.add("show")}
function addCart(v){const l=st.cart.find(x=>String(x.vid)==String(v.id)),q=(l?l.q:0)+1;if(q>v.stock)return toast("Only "+v.stock+" available");l?l.q=q:st.cart.push({vid:v.id,q:1});saveCart();toast("Added to cart");drawCart();showCart(true)}
function drawCart(){$("cc").textContent=st.cart.reduce((t,l)=>t+l.q,0);
 $("cart").innerHTML=`<button class="x" id="cx" aria-label="Close cart">×</button><h2 style="margin-bottom:8px">Your cart</h2>`+(st.cart.length?st.cart.map((l,k)=>{const f=findV(l.vid);return `<div class="line"><div class="th">${art(f.p,0)}</div><div style="flex:1"><div>${esc(f.p.name)}</div><small style="color:var(--mut)">${esc(vlabel(f.v))} · ${rs(f.p.price)}</small></div><div class="q"><button data-q="${k}:-1" aria-label="Less">−</button> ${l.q} <button data-q="${k}:1" aria-label="More">+</button></div></div>`}).join("")+`<p style="margin-top:16px;display:flex;justify-content:space-between"><span>Items total</span><b>${rs(total())}</b></p><p class="note">Advance ${rs(adv(total()))} (50%) now (Easypaisa). Delivery charges ${rs(DEL)} are paid on delivery.</p><button class="primary" id="co">Checkout</button>`:`<p style="color:var(--mut)">Your cart is empty. Pick a product and size to start.</p>`);
 $("cx").onclick=()=>showCart(false);if($("co"))$("co").onclick=()=>{showCart(false);checkout()}}
const showCart=v=>$("cart").classList.toggle("show",v);
function checkout(){const T=total(),A=adv(T),bal=T-A+DEL;
 $("cp").innerHTML=`<button class="x" aria-label="Close">×</button><h2 style="margin-bottom:12px">Checkout</h2>
 <div class="f"><label>Full name</label><input type="text" id="nm" maxlength="100"></div><div class="f"><label>Phone / WhatsApp</label><input type="tel" id="ph" maxlength="25" placeholder="03XX XXXXXXX"></div>
 <div class="f"><label>City</label><input type="text" id="ct" maxlength="100"></div><div class="f"><label>Delivery address</label><textarea id="ad" rows="2" maxlength="1000"></textarea></div>
 <div class="pay"><b>Easypaisa advance payment</b><p>Account title: <b>${esc(SET.easypaisa_title||"Will be updated soon")}</b></p><p>Account number: <b id="epn">${esc(SET.easypaisa_number||"Not available yet")}</b> ${SET.easypaisa_number?`<button class="chip" id="cpy" type="button">Copy</button>`:""}</p><p style="color:var(--mut)">${esc(SET.advance_instructions||"Send the advance, then place your order and send the screenshot on WhatsApp.")}</p></div>
 <p class="note">Advance Easypaisa par bhejne ke baad, order place karein. Phir WhatsApp khulega, wahan <b>payment ka screenshot aur Transaction ID</b> bhejein. Screenshot milne par hi order confirm hoga.</p>
 <p class="sum"><span>Items total</span><b>${rs(T)}</b></p><p class="sum"><span>Advance 50% (pay now)</span><b>${rs(A)}</b></p><p class="sum"><span>Delivery charges (pay on delivery)</span><b>${rs(DEL)}</b></p><p class="sum"><span>Pay on delivery (balance ${rs(T-A)} + ${rs(DEL)} delivery)</span><b>${rs(bal)}</b></p>
 <button class="primary" id="place">Place order</button>`;
 $("cp").querySelector(".x").onclick=()=>$("cov").classList.remove("show");$("place").onclick=place;
 if($("cpy"))$("cpy").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(SET.easypaisa_number).then(()=>toast("Number copied"),()=>toast("Copy nahi hua"))};
 $("cov").classList.add("show")}
async function place(){const v=id=>$(id).value.trim(),nm=v("nm"),ph=v("ph"),ct=v("ct"),ad=v("ad");
 if(!st.cart.length)return toast("Your cart is empty");
 if(!nm||!ph||!ct||!ad)return toast("Fill in all delivery details");
 const b=$("place");b.disabled=true;b.textContent="Please wait...";
 try{const T=total(),A=adv(T),lines=st.cart.map(l=>{const f=findV(l.vid);return f?f.p.name+" ("+vlabel(f.v)+") x "+l.q:""}).filter(Boolean),fd=new FormData();
  fd.append("customer_name",nm);fd.append("phone",ph);fd.append("city",ct);fd.append("address",ad);fd.append("payment_method","ADVANCE");fd.append("advance_amount",String(A));
  fd.append("items",JSON.stringify(st.cart.map(l=>({variant_id:String(l.vid),qty:l.q}))));
  const r=await fetch(FN,{method:"POST",headers:{apikey:KEY},body:fd});let j;
  try{j=await r.json()}catch{throw new Error("Server ka response samajh nahi aaya.")}
  if(!r.ok||!j.success)throw new Error(j.error||"Order submit nahi hua.");
  st.cart=[];saveCart();drawCart();done(j.order_number,{nm,ph,ct,ad,lines,T,A});load()
 }catch(e){toast(e.message||"Order submit nahi hua.");b.disabled=false;b.textContent="Place order"}}
function done(no,i){const msg="Hello Maazi, I placed order "+no+".\nName: "+i.nm+"\nPhone: "+i.ph+"\nCity: "+i.ct+"\nAddress: "+i.ad+"\nItems: "+i.lines.join(", ")+"\nItems total: "+rs(i.T)+"\nAdvance 50%: "+rs(i.A)+"\nDelivery charges (pay on delivery): "+rs(DEL)+"\nI am sending the payment screenshot and Transaction ID now.";
 $("cp").innerHTML=`<button class="x" aria-label="Close">×</button><h2>Order placed</h2><p style="margin:10px 0">Your order number is <b>${esc(no)}</b>. Keep it to track your delivery.</p><p style="margin:10px 0">Ab <b>${rs(i.A)}</b> advance Easypaisa par bhej kar, payment ka <b>screenshot aur Transaction ID WhatsApp par bhejein</b>. Screenshot milne par order confirm hoga.</p><div class="pay"><b>Easypaisa account</b><p>Account title: <b>${esc(SET.easypaisa_title||"Will be updated soon")}</b></p><p>Account number: <b>${esc(SET.easypaisa_number||"Not available yet")}</b> ${SET.easypaisa_number?`<button class="chip" id="cpy2" type="button">Copy</button>`:""}</p><p>Amount to send: <b>${rs(i.A)}</b></p></div><a class="primary" target="_blank" rel="noopener noreferrer" href="${wa(msg)}">Send payment screenshot on WhatsApp</a><button class="primary ghost" id="tr">Track this order</button>`;
 $("cp").querySelector(".x").onclick=()=>$("cov").classList.remove("show");$("tr").onclick=()=>{$("cov").classList.remove("show");track(no)};
 if($("cpy2"))$("cpy2").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(SET.easypaisa_number).then(()=>toast("Number copied"),()=>toast("Copy nahi hua"))}}
const stepOf=s=>({payment_submitted:0,pending_payment:0,pending:0,confirmed:1,processing:1,shipped:2,delivered:3})[String(s||"").toLowerCase()];
function track(pre){const L=["Placed","Confirmed","Shipped","Delivered"];
 $("tp").innerHTML=`<button class="x" aria-label="Close">×</button><h2 style="margin-bottom:12px">Track your order</h2><div class="f"><label>Order number</label><input type="text" id="tid" placeholder="MAZ-XXXXXXXXXX" value="${esc(pre||"")}"></div><div class="f"><label>Phone used for the order</label><input type="tel" id="tph" placeholder="03XX XXXXXXX"></div><button class="primary" id="tg">Track</button><div id="tres"></div>`;
 $("tp").querySelector(".x").onclick=()=>$("tov").classList.remove("show");
 $("tg").onclick=async()=>{const no=$("tid").value.trim(),ph=$("tph").value.trim();if(!no||!ph)return toast("Order number aur phone dono likhein");
  $("tres").innerHTML=`<p class="note">Checking...</p>`;
  const {data,error}=await DB.rpc("track_order",{p_order_number:no,p_phone:ph});
  if(error||!data){$("tres").innerHTML=`<p class="note">No order found. Check the order number and phone, then try again.</p>`;return}
  const k=stepOf(data.status),cancelled=String(data.status).toLowerCase()=="cancelled";
  $("tres").innerHTML=(cancelled?`<p class="note" style="color:#e8817f">This order was cancelled.</p>`:`<div class="steps">${L.map((l,i)=>`<div class="${i<=(k??0)?"on":""}">${l}</div>`).join("")}</div>`)+`<p>${esc(data.city||"")} · ${rs(data.total)}${data.balance_due!=null?` · Pay on delivery ${rs(data.balance_due)}`:""}</p><a class="chip" style="display:inline-block;margin-top:12px;text-decoration:none;color:inherit" target="_blank" rel="noopener noreferrer" href="${wa("Hello Maazi, I need help with order "+data.order_number)}">Problem with order? WhatsApp us</a>`};
 $("tov").classList.add("show");if(pre)$("tph").focus()}
function side(v){$("side").classList.toggle("show",v);$("scrim").classList.toggle("show",v)}
document.addEventListener("click",e=>{const g=s=>e.target.closest(s);let t;
 if(t=g("[data-c]")){st.cat=cats()[+t.dataset.c];side(false);drawNav();list()}
 else if(t=g("[data-s]")){st.size=st.size==t.dataset.s?null:t.dataset.s;drawNav();list()}
 else if(t=g("[data-k]")){st.col=st.col==t.dataset.k?null:t.dataset.k;drawNav();list()}
 else if(t=g("[data-d]")){const[id,k]=t.dataset.d.split(":");st.pos[id]=+k;list()}
 else if(t=g("[data-q]")){const[k,d]=t.dataset.q.split(":"),l=st.cart[+k],f=l&&findV(l.vid);if(!l||!f)return;const q=l.q+ +d;if(q>f.v.stock)return toast("Only "+f.v.stock+" available");l.q=q;if(q<1)st.cart.splice(+k,1);saveCart();drawCart()}
 else if(t=g("[data-o]")){open(t.dataset.o)}});
let sx=null,sid=null,sn=1;document.addEventListener("touchstart",e=>{const t=e.target.closest("[data-sl]");sid=t?t.dataset.sl:null;sn=t?+t.dataset.n:1;sx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{if(!sid||sn<2)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40){st.pos[sid]=((st.pos[sid]||0)+(dx<0?1:sn-1))%sn;list()}sid=null});
$("stock").onclick=()=>{st.stock=!st.stock;drawNav();list()};
$("price").oninput=e=>{st.price=+e.target.value;$("pv").textContent=st.price;list()};
$("sort").onchange=e=>{st.sort=e.target.value;list()};
$("fbtn").onclick=()=>$("filters").classList.toggle("show");
$("menuBtn").onclick=()=>side(true);$("scrim").onclick=()=>side(false);
$("cartBtn").onclick=()=>showCart(true);$("trackBtn").onclick=()=>track();
$("shop").onclick=()=>$("shopTop").scrollIntoView({behavior:"smooth"});
document.querySelectorAll(".ov").forEach(o=>o.addEventListener("click",e=>{if(e.target==o)o.classList.remove("show")}));
document.addEventListener("keydown",e=>{if(e.key=="Escape"){document.querySelectorAll(".ov.show").forEach(o=>o.classList.remove("show"));showCart(false);side(false)}});
drawNav();list();drawCart();load();

</script>
<script src="redesign.js"></script> 
<script src="sections.js"></script>
</body>
</html>
